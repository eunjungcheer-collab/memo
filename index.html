<title>메모장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --bg:#fff6f0;--panel:#fffdf8;--line:#f3d9d9;--text:#6b4c57;--sub:#b595a0;
  --accent:#ff8fab;--accent2:#ffb3c6;--shadow:0 4px 14px rgba(255,143,171,.18);
  --c0:#fffdf8;--c1:#ffe3ea;--c2:#fff1b8;--c3:#d8f3dc;--c4:#d6e8ff;--c5:#ecdcff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#2a2024;--panel:#352a2f;--line:#4d3b42;--text:#f5dfe5;--sub:#b595a0;
  --accent:#ff8fab;--accent2:#ff8fab;--shadow:0 4px 14px rgba(0,0,0,.3);
  --c0:#3b2f35;--c1:#5a3944;--c2:#5a5030;--c3:#34503c;--c4:#34455e;--c5:#46375e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;
  background-image:radial-gradient(circle at 12px 12px,rgba(255,179,198,.25) 2px,transparent 2.5px);background-size:28px 28px}
button{font:inherit;color:inherit;cursor:pointer}
aside{width:320px;min-width:0;background:var(--panel);border-right:2px dashed var(--line);display:flex;flex-direction:column}
.top{padding:16px 14px 12px;display:flex;gap:10px;flex-direction:column}
.top h1{font-size:24px;margin:0;display:flex;align-items:center;gap:8px;font-weight:400}
.top h1 img{width:34px;height:34px;border-radius:10px}
.row{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;padding:10px 14px;border:2px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:0}
input[type=search]:focus{border-color:var(--accent2)}
.btn{padding:9px 14px;border:2px solid var(--line);border-radius:999px;background:var(--panel);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow);white-space:nowrap}
.btn.danger:hover{border-color:#ff6b81;color:#ff6b81}
#list{flex:1;overflow:auto;padding:4px 12px 16px}
.item{padding:11px 14px;border-radius:18px;cursor:pointer;margin-bottom:10px;border:2px solid transparent;box-shadow:var(--shadow);transition:transform .12s;position:relative}
.item:hover{transform:translateY(-2px) rotate(-.4deg)}
.item.active{border-color:var(--accent)}
.item .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.item .p{font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.item .d{font-size:11.5px;opacity:.55;margin-top:4px}
.item .star{position:absolute;right:12px;top:9px;font-size:15px}
.empty{text-align:center;padding:40px 10px;font-size:15px;color:var(--sub);line-height:1.8}
.empty .big{font-size:44px;display:block}
main{flex:1;min-width:0;display:flex;flex-direction:column;margin:14px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--line);transition:background .2s}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px;flex-wrap:wrap;border-bottom:2px dashed rgba(0,0,0,.08)}
.bar .meta{flex:1;font-size:13px;opacity:.6;min-width:80px}
.dots{display:flex;gap:6px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.15);padding:0}
.dot.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#title{border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:26px;padding:18px 26px 4px}
#body{flex:1;overflow:auto;outline:0;color:var(--text);font:inherit;font-size:17px;line-height:32px;padding:6px 26px 26px;word-break:break-word;white-space:pre-wrap;
  background:repeating-linear-gradient(transparent,transparent 31px,rgba(0,0,0,.07) 31px,rgba(0,0,0,.07) 32px);background-attachment:local}
#body:empty:before{content:attr(data-ph);color:var(--sub);pointer-events:none}
#body img{max-width:100%;height:auto;border-radius:14px;display:block;margin:10px 0;box-shadow:var(--shadow);cursor:pointer;border:3px solid transparent}
#body img.sel{border-color:var(--accent)}
.none{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--sub);font-size:17px;background:var(--panel)}
.none img{width:110px;height:110px;border-radius:28px;box-shadow:var(--shadow)}
.back{display:none}
@media(max-width:700px){
  aside{width:100%;border-right:0}
  main{display:none;margin:0;border-radius:0;border:0;width:100%}
  body.editing aside{display:none}
  body.editing main{display:flex}
  .back{display:inline-block}
  .top{padding-top:calc(16px + env(safe-area-inset-top))}
}
</style>
</head>

    <div class="row">
      <input type="search" id="q" placeholder="🔍 메모 찾기">
      <button class="btn primary" id="add">✏️ 새 메모</button>

  </div>
  <div id="list"></div>
</aside>
<main id="main"></main>

<script>
(function(){
  var KEY="memo-app-v1", notes=[], cur=null, query="", idb=null, timers={};
  var ICON=document.querySelector('link[rel=icon]').href;
  var esc=function(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function fmt(t){var d=new Date(t),n=new Date();
    if(d.toDateString()===n.toDateString())return d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"});
    return d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})}
  function get(id){return notes.find(function(n){return n.id===id})}
  function col(n){return "var(--c"+(n.color||0)+")"}
  function imgCount(n){return ((n.html||"").match(/<img/g)||[]).length}

  /* ---------- 저장소: IndexedDB (실패하면 localStorage) ---------- */
  function openDB(){return new Promise(function(res){
    try{var r=indexedDB.open("memo-db",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("notes",{keyPath:"id"})};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
  function loadAll(){return new Promise(function(res){
    if(!idb){try{res(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){res([])}return}
    var q=idb.transaction("notes").objectStore("notes").getAll();
    q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}})}
  function persist(n){
    if(!idb){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){warn()}return}
    try{idb.transaction("notes","readwrite").objectStore("notes").put(n)}catch(e){warn()}}
  function remove(id){
    if(!idb){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}return}
    try{idb.transaction("notes","readwrite").objectStore("notes").delete(id)}catch(e){}}
  function saveSoon(n){clearTimeout(timers[n.id]);timers[n.id]=setTimeout(function(){persist(n)},350)}
  function flush(){Object.keys(timers).forEach(function(id){clearTimeout(timers[id]);var n=get(id);if(n)persist(n)});timers={}}
  function warn(){var m=document.getElementById("meta");if(m)m.textContent="⚠️ 저장 공간이 부족해요"}
  window.addEventListener("pagehide",flush);
  document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});

  /* ---------- 그림 처리 ---------- */
  function shrink(file){return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var M=1000,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.82))};
    im.onerror=function(){URL.revokeObjectURL(url);rej()};im.src=url})}
  function insertImages(files,body){
    var list=[].filter.call(files,function(f){return /^image\//.test(f.type)});
    if(!list.length)return false;
    body.focus();
    list.reduce(function(p,f){return p.then(function(){return shrink(f).then(function(src){
      document.execCommand("insertHTML",false,'<img src="'+src+'"><br>')})})},Promise.resolve())
      .then(function(){body.dispatchEvent(new Event("input"))});
    return true}

  /* ---------- 목록 ---------- */
  function renderList(){
    var q=query.toLowerCase();
    var arr=notes.filter(function(n){return !q||((n.title||"")+" "+(n.body||"")).toLowerCase().indexOf(q)>-1})
      .sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.updated-a.updated});
    var el=document.getElementById("list");
    if(!arr.length){el.innerHTML='<div class="empty"><span class="big">'+(q?"🫥":"🐣")+'</span>'+(q?"찾는 메모가 없어요":"아직 메모가 없어요<br>‘새 메모’를 눌러 시작해요!")+'</div>';return}
    el.innerHTML=arr.map(function(n){
      var ic=imgCount(n),pv=(n.body||"").replace(/\s+/g," ").slice(0,60);
      return '<div class="item'+(n.id===cur?" active":"")+'" data-id="'+n.id+'" style="background:'+col(n)+'">'+
        (n.pin?'<span class="star">⭐</span>':'')+
        '<div class="t">'+esc(n.title||"제목 없음")+'</div>'+
        '<div class="p">'+(ic?"🖼️ "+ic+"장 ":"")+esc(pv||(ic?"":"내용 없음"))+'</div>'+
        '<div class="d">'+fmt(n.updated)+'</div></div>'}).join("");
  }

  /* ---------- 편집 화면 ---------- */
  function renderMain(){
    var m=document.getElementById("main"),n=get(cur);
    document.body.classList.toggle("editing",!!n);
    if(!n){m.style.background="";m.innerHTML='<div class="none"><img src="'+ICON+'" alt=""><div>메모를 골라 보거나 새로 써 봐요 ✨</div></div>';return}
    m.style.background=col(n);
    var dots=[0,1,2,3,4,5].map(function(i){return '<button class="dot'+((n.color||0)===i?" on":"")+'" data-c="'+i+'" style="background:var(--c'+i+')" aria-label="색 '+i+'"></button>'}).join("");
    m.innerHTML='<div class="bar"><button class="btn back" id="bk">←</button><div class="meta" id="meta"></div>'+
      '<div class="dots" id="dots">'+dots+'</div>'+
      '<button class="btn" id="im">🖼️ 그림</button>'+
      '<button class="btn danger" id="di" style="display:none">❌ 그림 빼기</button>'+
      '<button class="btn" id="pn">'+(n.pin?"⭐ 고정됨":"☆ 고정")+'</button>'+
      '<button class="btn" id="cp">📋 복사</button>'+
      '<button class="btn danger" id="dl">🗑️ 삭제</button>'+
      '<input type="file" id="fi" accept="image/*" multiple hidden></div>'+
      '<input id="title" placeholder="제목을 적어요" maxlength="100">'+
      '<div id="body" contenteditable="true" data-ph="내용을 적거나 그림을 붙여 넣어요 🌷 (Ctrl+V)"></div>';
    var t=document.getElementById("title"),b=document.getElementById("body");
    t.value=n.title;
    b.innerHTML=n.html!=null?n.html:esc(n.body||"");
    meta(n);
    function upd(){n.title=t.value;n.html=b.innerHTML;n.body=b.innerText.replace(/ /g," ");n.updated=Date.now();saveSoon(n);meta(n);renderList()}
    t.oninput=upd;b.oninput=upd;
    b.addEventListener("paste",function(e){
      var cd=e.clipboardData;if(!cd)return;
      var files=[];[].forEach.call(cd.items||[],function(it){if(it.kind==="file"&&/^image\//.test(it.type))files.push(it.getAsFile())});
      if(files.length){e.preventDefault();insertImages(files,b);return}
      var txt=cd.getData("text/plain");
      if(txt){e.preventDefault();document.execCommand("insertText",false,txt)}
    });
    b.addEventListener("dragover",function(e){e.preventDefault()});
    b.addEventListener("drop",function(e){
      if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();insertImages(e.dataTransfer.files,b)}});
    var selImg=null,di=document.getElementById("di");
    b.addEventListener("click",function(e){
      if(selImg)selImg.classList.remove("sel");
      if(e.target.tagName==="IMG"){selImg=e.target;selImg.classList.add("sel");di.style.display=""}
      else{selImg=null;di.style.display="none"}});
    di.onclick=function(){if(selImg){selImg.remove();selImg=null;di.style.display="none";upd()}};
    var fi=document.getElementById("fi");
    document.getElementById("im").onclick=function(){fi.click()};
    fi.onchange=function(){insertImages(fi.files,b);fi.value=""};
    document.getElementById("dots").onclick=function(e){var d=e.target.closest(".dot");if(!d)return;n.color=+d.dataset.c;persist(n);renderMain();renderList()};
    document.getElementById("bk").onclick=function(){flush();cur=null;renderMain();renderList()};
    document.getElementById("pn").onclick=function(){n.pin=!n.pin;persist(n);renderMain();renderList()};
    document.getElementById("cp").onclick=function(){
      var txt=(n.title?n.title+"\n\n":"")+(n.body||""),btn=this;
      function ok(){btn.textContent="✅ 복사됨";setTimeout(function(){btn.textContent="📋 복사"},1200)}
      function fb(){btn.textContent="글자를 직접 복사해 주세요"}
      try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
    };
    var dl=document.getElementById("dl");
    dl.onclick=function(){
      if(dl.dataset.s){clearTimeout(timers[n.id]);delete timers[n.id];notes=notes.filter(function(x){return x.id!==n.id});remove(n.id);cur=null;renderMain();renderList();return}
      dl.dataset.s=1;dl.textContent="한 번 더 누르면 삭제";setTimeout(function(){dl.dataset.s="";dl.textContent="🗑️ 삭제"},2500)};
    if(!n.title&&!n.body&&!imgCount(n))t.focus();
  }
  function meta(n){var e=document.getElementById("meta");if(e)e.textContent=fmt(n.updated)+" · "+(n.body||"").length+"자"}

  document.getElementById("list").onclick=function(e){
    var it=e.target.closest(".item");if(!it)return;flush();cur=it.dataset.id;renderMain();renderList()};
  document.getElementById("add").onclick=function(){
    var n={id:uid(),title:"",body:"",html:"",pin:false,color:[1,2,3,4,5][Math.floor(Math.random()*5)],created:Date.now(),updated:Date.now()};
    notes.push(n);cur=n.id;query="";document.getElementById("q").value="";persist(n);renderMain();renderList()};
  document.getElementById("q").oninput=function(){query=this.value;renderList()};
  document.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="b"){e.preventDefault();document.getElementById("add").click()}});

  try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js')}catch(e){}

  openDB().then(function(d){idb=d;return loadAll()}).then(function(list){
    notes=list;
    /* 예전 버전(localStorage)에 저장된 메모 가져오기 */
    if(idb){try{var old=JSON.parse(localStorage.getItem(KEY)||"[]");
      old.forEach(function(o){if(!get(o.id)){notes.push(o);persist(o)}});
      if(old.length)localStorage.removeItem(KEY)}catch(e){}}
    var s=notes.slice().sort(function(a,b){return b.updated-a.updated})[0];
    if(window.innerWidth>700&&s)cur=s.id;
    renderMain();renderList();
  });
})();
</script>
</body>
</html>
